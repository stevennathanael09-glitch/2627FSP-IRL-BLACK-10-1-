
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kamera AI Multi Wajah</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;background:#101827;color:white;
  font-family:Arial,sans-serif;text-align:center
}
h1{font-size:25px}
#status,.person{
  max-width:700px;margin:14px auto;padding:14px;
  background:#243247;border-radius:12px
}
#cameraBox{
  position:relative;width:100%;max-width:700px;
  margin:15px auto;background:#000;
  border-radius:14px;overflow:hidden
}
video{display:block;width:100%;height:auto}
canvas{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none
}
button,select{
  padding:12px;margin:5px;border:0;border-radius:8px;
  font-size:15px
}
#startBtn{background:#22c55e;font-weight:bold}
#stopBtn{background:#ef4444;color:white}
.person{text-align:left;line-height:1.7}
.age{font-size:27px;font-weight:bold;color:#4ade80}
.small{font-size:12px;color:#cbd5e1}
</style>
</head>
<body>

<h1>📸 Kamera AI Multi Wajah</h1>
<p>Hadapkan satu orang atau beberapa orang ke kamera.</p>
<div id="status">Memuat AI...</div>

<div id="cameraBox">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<button id="startBtn" disabled>Aktifkan Kamera</button>
<button id="stopBtn">Matikan Kamera</button>

<div id="result">Hasil deteksi akan muncul di sini.</div>

<p class="small">
Umur hanya perkiraan. Status pernikahan tidak dapat diketahui
dari wajah. Warna kulit dipengaruhi cahaya dan kamera.
Suku/etnis tidak disimpulkan dari penampilan.
</p>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script>
const video=document.getElementById("video");
const canvas=document.getElementById("overlay");
const ctx=canvas.getContext("2d");
const statusBox=document.getElementById("status");
const resultBox=document.getElementById("result");
const startBtn=document.getElementById("startBtn");
const stopBtn=document.getElementById("stopBtn");

const MODEL_URL=
"https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";

let ready=false,stream=null,running=false,busy=false;
let tracks=new Map();
let nextId=1;
let lastSeen=new Map();

async function loadModels(){
  try{
    statusBox.textContent="Mengunduh model AI...";
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL),
      faceapi.nets.ageGenderNet.loadFromUri(MODEL_URL)
    ]);
    ready=true;
    startBtn.disabled=false;
    statusBox.textContent="AI siap digunakan.";
  }catch(e){
    console.error(e);
    statusBox.textContent="Model gagal dimuat. Periksa internet.";
  }
}

function reset(){
  tracks.clear();
  lastSeen.clear();
  nextId=1;
}

async function startCamera(){
  if(!ready)return;
  stopCamera();
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:"user",
        width:{ideal:640},
        height:{ideal:480}
      }
    });
    video.srcObject=stream;
    await video.play();
    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;
    reset();
    running=true;
    statusBox.textContent="Kamera aktif. Mencari semua wajah...";
    detectLoop();
  }catch(e){
    console.error(e);
    statusBox.textContent="Kamera gagal dibuka. Izinkan akses kamera.";
  }
}

function stopCamera(){
  running=false;
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
    stream=null;
  }
  video.srcObject=null;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  reset();
  resultBox.textContent="Kamera dimatikan.";
  statusBox.textContent=ready?"AI siap digunakan.":"Memuat AI...";
}

// Mengukur kemiripan posisi kotak wajah antarkerangka.
// Ini pelacakan sederhana, bukan pengenalan identitas.
function iou(a,b){
  const x1=Math.max(a.x,b.x),y1=Math.max(a.y,b.y);
  const x2=Math.min(a.x+a.width,b.x+b.width);
  const y2=Math.min(a.y+a.height,b.y+b.height);
  const inter=Math.max(0,x2-x1)*Math.max(0,y2-y1);
  const union=a.width*a.height+b.width*b.height-inter;
  return union>0?inter/union:0;
}

function getTrack(box,age){
  let bestId=null,bestScore=0;
  for(const [id,t] of tracks){
    if(t.matched)continue;
    const score=iou(t.box,box);
    if(score>bestScore){
      bestScore=score;
      bestId=id;
    }
  }

  // Jika tidak cocok dengan wajah yang sebelumnya, buat track baru.
  if(bestId===null||bestScore<0.2){
    bestId=nextId++;
    tracks.set(bestId,{
      box,ages:[],age:null,marriage:null,matched:true
    });
  }

  const t=tracks.get(bestId);
  t.box=box;
  t.matched=true;
  lastSeen.set(bestId,Date.now());

  if(t.age===null){
    t.ages.push(age);
    if(t.ages.length>15)t.ages.shift();

    // Tunggu lebih banyak sampel sebelum mengunci angka umur.
    if(t.ages.length>=10){
      const sorted=[...t.ages].sort((a,b)=>a-b);
      t.age=Math.max(1,Math.min(100,
        Math.round(sorted[Math.floor(sorted.length/2)])));
      t.marriage=Math.random()<0.5
        ?"Kemungkinan sudah menikah"
        :"Kemungkinan belum menikah";
    }
  }
  return {id:bestId,track:t};
}

function ageGroup(age){
  if(age<13)return"Anak-anak";
  if(age<20)return"Remaja";
  if(age<40)return"Dewasa muda";
  if(age<60)return"Dewasa";
  return"Lansia";
}

function skinEstimate(video,box){
  // Sampel area tengah wajah sebagai warna visual kasar.
  // Ini bukan penilaian ras, etnis, atau identitas.
  const x=Math.max(0,Math.floor(box.x+box.width*.35));
  const y=Math.max(0,Math.floor(box.y+box.height*.40));
  const w=Math.max(1,Math.min(
    Math.floor(box.width*.3),video.videoWidth-x));
  const h=Math.max(1,Math.min(
    Math.floor(box.height*.15),video.videoHeight-y));

  if(w<1||h<1)return"Belum dapat diperkirakan";

  const sample=document.createElement("canvas");
  sample.width=1;sample.height=1;
  const sctx=sample.getContext("2d",{willReadFrequently:true});
  sctx.drawImage(video,x,y,w,h,0,0,1,1);
  const d=sctx.getImageData(0,0,1,1).data;

  const r=d[0],g=d[1],b=d[2];
  const brightness=(r+g+b)/3;

  if(brightness<65)return"Sangat gelap (estimasi visual)";
  if(brightness<105)return"Gelap (estimasi visual)";
  if(brightness<150)return"Sedang/sawo matang (estimasi visual)";
  if(brightness<190)return"Terang/langsat (estimasi visual)";
  return"Sangat terang (estimasi visual)";
}

async function detectLoop(){
  if(!running||busy)return;
  busy=true;

  try{
    if(video.readyState>=2){
      for(const t of tracks.values())t.matched=false;

      const faces=await faceapi
        .detectAllFaces(video,new faceapi.TinyFaceDetectorOptions({
          inputSize:416,scoreThreshold:0.35
        }))
        .withFaceLandmarks(true)
        .withAgeAndGender();

      if(!running)return;

      ctx.clearRect(0,0,canvas.width,canvas.height);
      const resized=faceapi.resizeResults(faces,{
        width:canvas.width,height:canvas.height
      });

      const people=[];
      for(let i=0;i<faces.length;i++){
        const f=faces[i];
        const box=f.detection.box;
        const {id,track}=getTrack(box,f.age);
        const skin=skinEstimate(video,box);
        people.push({id,track,box,skin,confidence:
          Math.round(f.detection.score*100)});
      }

      // Hapus track yang hilang lebih dari 2,5 detik.
      const now=Date.now();
      for(const [id,time] of lastSeen){
        if(now-time>2500){
          lastSeen.delete(id);
          tracks.delete(id);
        }
      }

      statusBox.textContent=faces.length
        ?faces.length+" wajah terdeteksi."
        :"Belum ada wajah terdeteksi. Hadap kamera dan tambah cahaya.";

      resultBox.replaceChildren();

      if(!faces.length){
        resultBox.textContent="Belum ada wajah terdeteksi.";
      }

      people.forEach(p=>{
        const t=p.track;
        const box=p.box;
        const label=t.age!==null
          ?t.age+" tahun"
          :"Menganalisis umur...";

        ctx.strokeStyle="#22c55e";
        ctx.lineWidth=3;
        ctx.strokeRect(box.x,box.y,box.width,box.height);

        ctx.font="bold 16px Arial";
        const labelWidth=ctx.measureText(label).width+12;
        const labelX=Math.max(0,Math.min(
          box.x,canvas.width-labelWidth));
        const labelY=Math.max(0,box.y-27);
        ctx.fillStyle="#22c55e";
        ctx.fillRect(labelX,labelY,labelWidth,25);
        ctx.fillStyle="#07130b";
        ctx.fillText(label,labelX+6,labelY+18);

        const card=document.createElement("div");
        card.className="person";

        const title=document.createElement("div");
        title.className="age";
        title.textContent="Orang #"+p.id+": "+label;
        card.appendChild(title);

        const group=document.createElement("div");
        group.textContent=t.age!==null
          ?"Kategori: "+ageGroup(t.age)
          :"Kategori: menunggu hasil AI";
        card.appendChild(group);

        const marriage=document.createElement("div");
        marriage.textContent="Status menikah: "+
          (t.marriage||"Belum ditentukan");
        card.appendChild(marriage);

        const skin=document.createElement("div");
        skin.textContent="Warna kulit visual: "+p.skin;
        card.appendChild(skin);

        const ethnicity=document.createElement("div");
        ethnicity.textContent="Suku/etnis: Tidak diketahui";
        card.appendChild(ethnicity);

        const note=document.createElement("div");
        note.className="small";
        note.textContent=
          "Umur adalah estimasi AI. Status menikah adalah tebakan acak. " +
          "Warna kulit dipengaruhi cahaya. Suku/etnis tidak disimpulkan dari wajah.";
        card.appendChild(note);

        resultBox.appendChild(card);
      });
    }
  }catch(e){
    console.error(e);
    statusBox.textContent="Deteksi gagal. Periksa koneksi dan model AI.";
  }finally{
    busy=false;
    if(running)setTimeout(detectLoop,300);
  }
}

startBtn.addEventListener("click",startCamera);
stopBtn.addEventListener("click",stopCamera);

if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
  loadModels();
}else{
  statusBox.textContent="Gunakan browser yang mendukung kamera melalui HTTPS.";
}
</script>
</body>
</html>
