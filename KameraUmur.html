<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kamera HP dan Tablet</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #camera {
      width: 100%;
      max-width: 500px;
      height: auto;
      min-height: 250px;
      max-height: 65vh;
      background: #000;
      border-radius: 12px;
      object-fit: contain;
    }

    button {
      padding: 13px 18px;
      margin: 6px 3px;
      border: 0;
      border-radius: 8px;
      background: #0284c7;
      color: white;
      font-size: 16px;
    }

    #status {
      overflow-wrap: anywhere;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <h2>Kamera HP / Tablet</h2>
  <p id="status">Tekan tombol untuk membuka kamera.</p>

  <video id="camera" autoplay muted playsinline></video>

  <br>

  <button id="open">Buka Kamera</button>
  <button id="flip" disabled>Ganti Kamera</button>
  <button id="close" disabled>Tutup Kamera</button>

  <script>
    const video = document.getElementById("camera");
    const status = document.getElementById("status");
    const openBtn = document.getElementById("open");
    const flipBtn = document.getElementById("flip");
    const closeBtn = document.getElementById("close");

    let stream = null;
    let facing = "user";
    let opening = false;

    async function openCamera() {
      if (opening) return;
      opening = true;
      openBtn.disabled = true;
      status.textContent = "Menghubungkan kamera...";

      try {
        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error(
            "Browser memblokir kamera. Buka halaman menggunakan HTTPS."
          );
        }

        // Matikan kamera sebelumnya.
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }

        video.srcObject = null;

        // Gunakan pengaturan dasar agar kompatibel.
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: facing }
        });

        video.srcObject = stream;
        await video.play();

        status.textContent = "Kamera berhasil dibuka!";
        flipBtn.disabled = false;
        closeBtn.disabled = false;

      } catch (err) {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }

        video.srcObject = null;

        const errors = {
          NotAllowedError:
            "Izin kamera ditolak. Aktifkan izin kamera di pengaturan browser.",
          NotFoundError:
            "Kamera tidak ditemukan pada perangkat.",
          NotReadableError:
            "Kamera sedang dipakai aplikasi lain. Tutup aplikasi tersebut.",
          OverconstrainedError:
            "Kamera yang diminta tidak tersedia. Coba lagi."
        };

        status.textContent =
          "Gagal: " + (errors[err.name] || err.message);

        console.error(err);
        flipBtn.disabled = true;
        closeBtn.disabled = true;

      } finally {
        opening = false;
        openBtn.disabled = false;
      }
    }

    function closeCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
      flipBtn.disabled = true;
      closeBtn.disabled = true;
      status.textContent = "Kamera ditutup.";
    }

    openBtn.addEventListener("click", openCamera);

    flipBtn.addEventListener("click", async () => {
      facing = facing === "user" ? "environment" : "user";
      await openCamera();
    });

    closeBtn.addEventListener("click", closeCamera);

    window.addEventListener("pagehide", closeCamera);
  </script>

</body>
</html>
