
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kamera AI Prediksi Umur</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 { font-size: 25px; }

    #status {
      padding: 12px;
      margin: 15px auto;
      background: #243247;
      border-radius: 10px;
      max-width: 500px;
    }

    #cameraBox {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 15px auto;
      overflow: hidden;
      border-radius: 14px;
      background: #000;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
    }

    canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    button {
      padding: 13px 18px;
      margin: 6px;
      border: 0;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn { background: #22c55e; color: #07130b; }
    #stopBtn { background: #ef4444; color: white; }

    #result {
      max-width: 500px;
      margin: 15px auto;
      padding: 15px;
      background: #243247;
      border-radius: 12px;
      font-size: 17px;
      line-height: 1.7;
    }

    .small {
      font-size: 13px;
      color: #cbd5e1;
    }

    .age {
      font-size: 30px;
      font-weight: bold;
      color: #4ade80;
    }
  </style>
</head>

<body>
  <h1>📸 Kamera AI Prediksi Umur</h1>
  <p>Arahkan kamera ke wajah untuk melihat hasil perkiraan.</p>

  <div id="status">Memuat sistem AI...</div>

  <div id="cameraBox">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <button id="startBtn" disabled>Aktifkan Kamera</button>
  <button id="stopBtn">Matikan Kamera</button>

  <div id="result">
    Hasil prediksi akan muncul di sini.
  </div>

  <p class="small">
    Umur adalah perkiraan AI. Status menikah merupakan tebakan
    acak untuk hiburan, bukan hasil deteksi wajah.
  </p>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("overlay");
    const ctx = canvas.getContext("2d");
    const statusBox = document.getElementById("status");
    const resultBox = document.getElementById("result");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    const MODEL_URL =
      "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";

    let modelsReady = false;
    let cameraStream = null;
    let detecting = false;
    let busy = false;

    // Penyimpanan hasil agar umur tidak berubah setiap frame.
    let ageSamples = [];
    let fixedAge = null;
    let fixedMarriageGuess = null;
    let missingFrames = 0;

    async function loadModels() {
      try {
        statusBox.textContent = "Sedang mengunduh model AI...";

        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL),
          faceapi.nets.ageGenderNet.loadFromUri(MODEL_URL)
        ]);

        modelsReady = true;
        statusBox.textContent = "AI siap! Tekan Aktifkan Kamera.";
        startBtn.disabled = false;
      } catch (err) {
        console.error(err);
        statusBox.textContent =
          "Model AI gagal dimuat. Periksa koneksi internet.";
      }
    }

    async function startCamera() {
      if (!modelsReady) return;

      stopCamera();

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: "user",
            width: { ideal: 640 },
            height: { ideal: 480 }
          }
        });

        video.srcObject = cameraStream;
        await video.play();

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        resetPrediction();
        detecting = true;
        statusBox.textContent = "Kamera aktif. Mencari wajah...";
        detectLoop();

      } catch (err) {
        console.error(err);
        statusBox.textContent =
          "Kamera gagal dibuka. Izinkan akses kamera di browser.";
      }
    }

    function resetPrediction() {
      ageSamples = [];
      fixedAge = null;
      fixedMarriageGuess = null;
      missingFrames = 0;
    }

    function stopCamera() {
      detecting = false;

      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }

      video.srcObject = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      resetPrediction();

      resultBox.textContent = "Kamera dimatikan.";
      statusBox.textContent = modelsReady
        ? "AI siap digunakan."
        : "Memuat model AI...";
    }

    function ageGroup(age) {
      if (age < 13) return "Anak-anak";
      if (age < 20) return "Remaja";
      if (age < 40) return "Dewasa muda";
      if (age < 60) return "Dewasa";
      return "Lansia";
    }

    // Mengambil nilai tengah agar hasil lebih stabil.
    function median(values) {
      const sorted = [...values].sort((a, b) => a - b);
      const mid = Math.floor(sorted.length / 2);

      return sorted.length % 2
        ? sorted[mid]
        : (sorted[mid - 1] + sorted[mid]) / 2;
    }

    async function detectLoop() {
      if (!detecting || busy) return;
      busy = true;

      try {
        if (video.readyState >= 2) {
          const detections = await faceapi
            .detectAllFaces(
              video,
              new faceapi.TinyFaceDetectorOptions({
                inputSize: 320,
                scoreThreshold: 0.35
              })
            )
            .withFaceLandmarks(true)
            .withAgeAndGender();

          if (!detecting) return;

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          const resized = faceapi.resizeResults(detections, {
            width: canvas.width,
            height: canvas.height
          });

          faceapi.draw.drawDetections(canvas, resized);

          if (detections.length === 0) {
            missingFrames++;

            statusBox.textContent =
              "Wajah belum terdeteksi. Hadap kamera dan tambah pencahayaan.";

            if (missingFrames > 5) {
              resetPrediction();
              resultBox.textContent = "Belum ada wajah terdeteksi.";
            }
          } else {
            missingFrames = 0;

            // Mode utama: satu wajah di depan kamera.
            // Untuk banyak wajah, tiap wajah belum memiliki
            // pelacakan identitas yang terpisah.
            const face = detections[0];

            if (fixedAge === null) {
              ageSamples.push(face.age);

              statusBox.textContent =
                "Menganalisis umur... " +
                Math.min(ageSamples.length, 7) + "/7";

              if (ageSamples.length >= 7) {
                fixedAge = Math.max(
                  1,
                  Math.min(100, Math.round(median(ageSamples)))
                );

                // Label acak, bukan inferensi dari wajah.
                fixedMarriageGuess = Math.random() < 0.5
                  ? "Kemungkinan sudah menikah"
                  : "Kemungkinan belum menikah";
              }
            }

            if (fixedAge !== null) {
              statusBox.textContent = "Wajah terdeteksi!";

              resultBox.replaceChildren();

              const ageTitle = document.createElement("div");
              ageTitle.className = "age";
              ageTitle.textContent = fixedAge + " tahun";

              const group = document.createElement("div");
              group.textContent = "Kategori: " + ageGroup(fixedAge);

              const marriage = document.createElement("div");
              marriage.textContent = "Status: " + fixedMarriageGuess;

              const note = document.createElement("p");
              note.className = "small";
              note.textContent =
                "Status menikah dipilih secara acak untuk hiburan.";

              resultBox.append(ageTitle, group, marriage, note);

              const box = face.detection.box;
              const label = fixedAge + " tahun";

              ctx.font = "bold 17px Arial";
              const labelWidth = ctx.measureText(label).width + 12;
              const labelX = Math.max(
                0,
                Math.min(box.x, canvas.width - labelWidth)
              );
              const labelY = Math.max(0, box.y - 28);

              ctx.fillStyle = "#22c55e";
              ctx.fillRect(labelX, labelY, labelWidth, 26);

              ctx.fillStyle = "#07130b";
              ctx.fillText(label, labelX + 6, labelY + 18);
            }
          }
        }
      } catch (err) {
        console.error(err);
        statusBox.textContent =
          "AI mengalami kendala. Periksa koneksi dan model.";
      } finally {
        busy = false;

        if (detecting) {
          setTimeout(detectLoop, 350);
        }
      }
    }

    startBtn.addEventListener("click", startCamera);
    stopBtn.addEventListener("click", stopCamera);

    if (navigator.mediaDevices &&
        navigator.mediaDevices.getUserMedia) {
      loadModels();
    } else {
      statusBox.textContent =
        "Browser tidak mendukung kamera. Gunakan HTTPS.";
    }
  </script>
</body>
</html>
