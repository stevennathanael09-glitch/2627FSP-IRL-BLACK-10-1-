
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kamera AI Prediksi Umur</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 { font-size: 25px; }

    #status {
      padding: 12px;
      margin: 15px auto;
      background: #243247;
      border-radius: 10px;
      max-width: 500px;
    }

    #cameraBox {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 15px auto;
      overflow: hidden;
      border-radius: 14px;
      background: #000;
    }

    video, canvas {
      display: block;
      width: 100%;
    }

    video { height: auto; }

    canvas {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      pointer-events: none;
    }

    button {
      padding: 13px 18px;
      margin: 6px;
      border: 0;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn { background: #22c55e; color: #07130b; }
    #stopBtn { background: #ef4444; color: white; }

    #result {
      max-width: 500px;
      margin: 15px auto;
      padding: 15px;
      background: #243247;
      border-radius: 12px;
      font-size: 19px;
    }

    .small {
      font-size: 13px;
      color: #cbd5e1;
    }
  </style>
</head>

<body>
  <h1>📸 Kamera AI Prediksi Umur</h1>
  <p>Arahkan kamera ke wajah, lalu tunggu AI menganalisis.</p>

  <div id="status">Memuat sistem AI...</div>

  <div id="cameraBox">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <button id="startBtn" disabled>Aktifkan Kamera</button>
  <button id="stopBtn">Matikan Kamera</button>

  <div id="result">
    Hasil prediksi umur akan muncul di sini.
  </div>

  <p class="small">
    Prediksi AI hanya perkiraan, bukan umur asli.
  </p>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("overlay");
    const ctx = canvas.getContext("2d");
    const statusBox = document.getElementById("status");
    const resultBox = document.getElementById("result");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    const MODEL_URL =
      "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";

    let modelsReady = false;
    let cameraStream = null;
    let detecting = false;
    let busy = false;
    let lastFaceCount = -1;

    async function loadModels() {
      try {
        statusBox.textContent = "Sedang mengunduh model AI...";

        if (!window.faceapi) {
          throw new Error("Library AI gagal dimuat. Periksa internet.");
        }

        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL),
          faceapi.nets.ageGenderNet.loadFromUri(MODEL_URL)
        ]);

        modelsReady = true;
        statusBox.textContent =
          "AI siap! Tekan Aktifkan Kamera.";
        startBtn.disabled = false;
      } catch (err) {
        console.error(err);
        statusBox.textContent =
          "Model AI gagal dimuat. Periksa koneksi internet atau URL model.";
      }
    }

    async function startCamera() {
      if (!modelsReady) return;

      try {
        stopCamera();

        statusBox.textContent = "Meminta izin kamera...";

        cameraStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: "user",
            width: { ideal: 640 },
            height: { ideal: 480 }
          }
        });

        video.srcObject = cameraStream;
        await video.play();

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        detecting = true;
        statusBox.textContent =
          "Kamera aktif. Mencari wajah...";
        detectLoop();

      } catch (err) {
        console.error(err);
        statusBox.textContent =
          "Kamera gagal dibuka. Izinkan akses kamera di browser.";
      }
    }

    function stopCamera() {
      detecting = false;

      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }

      video.srcObject = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      resultBox.textContent = "Kamera dimatikan.";
      statusBox.textContent = modelsReady
        ? "AI siap digunakan."
        : "Memuat model AI...";
    }

    function ageGroup(age) {
      if (age < 13) return "Anak-anak";
      if (age < 20) return "Remaja";
      if (age < 40) return "Dewasa muda";
      if (age < 60) return "Dewasa";
      return "Lansia";
    }

    async function detectLoop() {
      if (!detecting || busy) return;

      busy = true;

      try {
        if (video.readyState >= 2) {
          const detections = await faceapi
            .detectAllFaces(
              video,
              new faceapi.TinyFaceDetectorOptions({
                inputSize: 320,
                scoreThreshold: 0.35
              })
            )
            .withFaceLandmarks(true)
            .withAgeAndGender();

          if (!detecting) return;

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          const resized = faceapi.resizeResults(detections, {
            width: canvas.width,
            height: canvas.height
          });

          faceapi.draw.drawDetections(canvas, resized);

          if (detections.length === 0) {
            statusBox.textContent =
              "Wajah belum terdeteksi. Hadap kamera dan tambah pencahayaan.";
            resultBox.textContent = "Belum ada wajah terdeteksi.";
          } else {
            statusBox.textContent =
              "Berhasil mendeteksi " + detections.length + " wajah.";

            resultBox.innerHTML = "";

            detections.forEach((face, index) => {
              const age = Math.round(face.age);
              const confidence =
                Math.round(face.detection.score * 100);

              const line = document.createElement("p");
              line.textContent =
                "Wajah " + (index + 1) +
                ": perkiraan " + age + " tahun (" +
                ageGroup(age) + ")" +
                " — deteksi wajah " + confidence + "%";

              resultBox.appendChild(line);

              const box = face.detection.box;
              const label =
                age + " tahun | " + ageGroup(age);

              ctx.font = "bold 17px Arial";
              ctx.fillStyle = "#22c55e";
              ctx.fillRect(
                box.x,
                Math.max(0, box.y - 28),
                Math.min(ctx.measureText(label).width + 12,
                  canvas.width - box.x),
                26
              );

              ctx.fillStyle = "#07130b";
              ctx.fillText(
                label,
                box.x + 5,
                Math.max(18, box.y - 9)
              );
            });
          }
        }
      } catch (err) {
        console.error(err);
        statusBox.textContent =
          "AI mengalami kendala. Periksa koneksi dan model.";
      } finally {
        busy = false;
        if (detecting) {
          setTimeout(detectLoop, 350);
        }
      }
    }

    startBtn.addEventListener("click", startCamera);
    stopBtn.addEventListener("click", stopCamera);

    if (navigator.mediaDevices &&
        navigator.mediaDevices.getUserMedia) {
      loadModels();
    } else {
      statusBox.textContent =
        "Browser tidak mendukung akses kamera. Gunakan HTTPS.";
    }
  </script>
</body>
</html>
